<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTK 设备配置</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="logo.png" width="236" height="40" alt="SingularXYZ">
    <div class="subline" id="hdr-sub">RTK 设备配置 · --</div>
  </header>

  <div class="chips">
    <span class="pill"><span class="dot" id="conn-dot"></span><span id="conn-txt">正在连接...</span></span>
    <span class="pill" id="chip-fix">定位: --</span>
    <span class="pill" id="chip-sats">卫星: --</span>
    <span class="pill pill-accent">Wi-Fi 配置</span>
  </div>

  <div class="banner" id="banner"></div>

  <section class="card" id="sec-dev">
    <button type="button" class="card-btn" data-toggle="sec-dev">
      <span>设备信息</span>
      <svg class="caret" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.2 5.8 8 10.6l4.8-4.8-.9-.9L8 8.8 4.1 4.9z"/></svg>
    </button>
    <div class="card-collapse"><div class="card-inner"><div class="card-body">
      <div class="kv">
        <span class="k">板型</span><span class="v" id="d-board">--</span>
        <span class="k">固件版本</span><span class="v" id="d-fw">--</span>
        <span class="k">SN</span><span class="v" id="d-sn">--</span>
        <span class="k">蓝牙名称</span><span class="v" id="d-bt">--</span>
        <span class="k">射频模式</span><span class="v" id="d-radio">Wi-Fi 配置</span>
        <span class="k">运行时间</span><span class="v" id="d-up">--</span>
        <span class="k">空闲堆</span><span class="v" id="d-heap">--</span>
        <span class="k">复位原因</span><span class="v" id="d-reset">--</span>
      </div>
    </div></div></div>
  </section>

  <section class="card" id="sec-gnss">
    <button type="button" class="card-btn" data-toggle="sec-gnss">
      <span>GNSS 配置与状态</span>
      <svg class="caret" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.2 5.8 8 10.6l4.8-4.8-.9-.9L8 8.8 4.1 4.9z"/></svg>
    </button>
    <div class="card-collapse"><div class="card-inner"><div class="card-body">
      <div class="kv">
        <span class="k">模块状态</span><span class="v" id="g-state">--</span>
        <span class="k">型号 / 固件</span><span class="v" id="g-model">--</span>
        <span class="k">定位类型</span><span class="v" id="g-fix">--</span>
        <span class="k">卫星数</span><span class="v" id="g-sats">--</span>
        <span class="k">水平精度</span><span class="v" id="g-hacc">--</span>
        <span class="k">实际输出</span><span class="v" id="g-hz">--</span>
      </div>
      <div class="divider"></div>
      <span class="fld-lbl">定位频率 (Hz)</span>
      <div class="seg" id="rate-seg" role="group" aria-label="定位频率">
        <button type="button" class="seg-btn" data-rate="1">1 Hz</button>
        <button type="button" class="seg-btn" data-rate="2">2 Hz</button>
        <button type="button" class="seg-btn" data-rate="5">5 Hz</button>
        <button type="button" class="seg-btn" data-rate="10">10 Hz</button>
        <button type="button" class="seg-btn" data-rate="20">20 Hz</button>
      </div>
      <select id="cfg-rate" data-key="gnss.rate" class="hide" aria-hidden="true">
        <option value="1">1 Hz</option>
        <option value="2">2 Hz</option>
        <option value="5">5 Hz</option>
        <option value="10">10 Hz</option>
        <option value="20">20 Hz</option>
      </select>
      <div class="row">
        <label for="cfg-gga">GGA 周期 (ms)</label>
        <select id="cfg-gga" data-key="gnss.out.gga"></select>
      </div>
      <div class="row">
        <label for="cfg-gsa">GSA 周期 (ms)</label>
        <select id="cfg-gsa" data-key="gnss.out.gsa"></select>
      </div>
      <div class="row">
        <label for="cfg-gsv">GSV 周期 (ms)</label>
        <select id="cfg-gsv" data-key="gnss.out.gsv"></select>
      </div>
      <div class="row">
        <label for="cfg-gst">GST 周期 (ms)</label>
        <select id="cfg-gst" data-key="gnss.out.gst"></select>
      </div>
      <div class="row">
        <label for="cfg-rmc">RMC 周期 (ms)</label>
        <select id="cfg-rmc" data-key="gnss.out.rmc"></select>
      </div>
      <div id="const-box" class="hide">
        <div class="divider"></div>
        <span class="fld-lbl">星座开关</span>
        <div class="switches">
          <label class="sw-card"><span>GPS</span><span class="sw"><input type="checkbox" data-const="gnss.const.gps"><span class="sw-track"></span></span></label>
          <label class="sw-card"><span>BDS (北斗)</span><span class="sw"><input type="checkbox" data-const="gnss.const.bds"><span class="sw-track"></span></span></label>
          <label class="sw-card"><span>GLO</span><span class="sw"><input type="checkbox" data-const="gnss.const.glo"><span class="sw-track"></span></span></label>
          <label class="sw-card"><span>GAL</span><span class="sw"><input type="checkbox" data-const="gnss.const.gal"><span class="sw-track"></span></span></label>
        </div>
      </div>
      <button type="button" class="btn btn-full" id="btn-gnss-save">保存 GNSS 配置到模块</button>
      <div class="msg" id="msg-gnss"></div>
    </div></div></div>
  </section>

  <section class="card collapsed" id="sec-bt">
    <button type="button" class="card-btn" data-toggle="sec-bt">
      <span>蓝牙白名单与配对</span>
      <svg class="caret" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.2 5.8 8 10.6l4.8-4.8-.9-.9L8 8.8 4.1 4.9z"/></svg>
    </button>
    <div class="card-collapse"><div class="card-inner"><div class="card-body">
      <span class="fld-lbl">当前白名单</span>
      <ul class="wl-list" id="bt-wl"></ul>
      <div class="wl-empty hide" id="bt-wl-empty">白名单为空</div>
      <div class="row">
        <input type="text" class="input-grow" id="bt-mac" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17">
        <button type="button" class="btn" id="btn-wl-add">添加</button>
      </div>
      <div class="divider"></div>
      <div class="row">
        <label for="cfg-pair">下次蓝牙启动打开配对窗口</label>
        <select id="cfg-pair" data-key="bt.pair_next">
          <option value="0">关闭</option>
          <option value="1">打开</option>
        </select>
      </div>
      <div class="msg" id="msg-bt"></div>
    </div></div></div>
  </section>

  <section class="card collapsed" id="sec-fac">
    <button type="button" class="card-btn" data-toggle="sec-fac">
      <span>工厂配置</span>
      <svg class="caret" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.2 5.8 8 10.6l4.8-4.8-.9-.9L8 8.8 4.1 4.9z"/></svg>
    </button>
    <div class="card-collapse"><div class="card-inner"><div class="card-body">
      <div id="fac-locked">
        <div class="row">
          <input type="password" class="input-grow" id="fac-token" placeholder="输入工厂解锁口令">
          <button type="button" class="btn" id="btn-unlock">解锁</button>
        </div>
      </div>
      <div id="fac-unlocked" class="hide">
        <div class="row">
          <input type="text" class="input-grow" id="fac-sn" placeholder="SN (1-16位 字母/数字/-)" maxlength="16">
          <button type="button" class="btn" id="btn-sn">写入 SN</button>
        </div>
        <div class="divider"></div>
        <button type="button" class="btn btn-danger btn-full" id="btn-freset">恢复出厂设置</button>
      </div>
      <div class="msg" id="msg-fac"></div>
    </div></div></div>
  </section>

  <section class="card collapsed" id="sec-sys">
    <button type="button" class="card-btn" data-toggle="sec-sys">
      <span>系统与退出</span>
      <svg class="caret" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.2 5.8 8 10.6l4.8-4.8-.9-.9L8 8.8 4.1 4.9z"/></svg>
    </button>
    <div class="card-collapse"><div class="card-inner"><div class="card-body">
      <div class="kv">
        <span class="k">板型 / 固件</span><span class="v" id="s-info">--</span>
        <span class="k">控制台档位</span><span class="v" id="s-con">--</span>
      </div>
      <div class="divider"></div>
      <button type="button" class="btn btn-ghost btn-full" id="btn-exit">退出网页配置并切回蓝牙模式</button>
      <div class="msg" id="msg-sys"></div>
    </div></div></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
