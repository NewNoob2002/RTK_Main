<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>RTK Configuration</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
    <span class="word">Singular<b>XYZ</b></span>
    <span class="dev" id="dev-name">--</span>
  </div>
  <div class="bar" role="status" aria-live="polite">
    <span class="pill" id="p-conn"><i class="dot"></i><span>Connecting</span></span>
    <span class="pill" id="p-fix">Fix --</span>
    <span class="pill" id="p-sats">Sats --</span>
    <span class="pill bad" id="p-gate" hidden>GGA held</span>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main class="grid">
  <div class="col" id="col-a"></div>
  <div class="col" id="col-b"></div>
</main>
<footer class="foot">Wi-Fi configuration mode · changes apply immediately and are kept after restart</footer>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<script src="app.js"></script>
</body>
</html>
